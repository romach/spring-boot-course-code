databaseChangeLog:
  - changeSet:
      id: 002-create-author-table
      author: roman
      changes:
        - createTable:
            tableName: author
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
