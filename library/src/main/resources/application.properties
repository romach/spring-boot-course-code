# Hibernate never alters the schema - Liquibase owns it. Just verify entities match the tables.
spring.jpa.hibernate.ddl-auto=validate

# Render Page results in the stable { content, page } shape (PagedModel) instead of raw PageImpl
spring.data.web.pageable.serialization-mode=via_dto

# Cap how many rows one page request can pull
spring.data.web.pageable.max-page-size=100
# (optional) change the default page size for unparameterized requests
spring.data.web.pageable.default-page-size=20

# Close the session at the end of the service layer, not the end of the request
spring.jpa.open-in-view=false

# Docs page (Scalar) at /docs, titled after the API
scalar.path=/docs
scalar.page-title=Library API
# No AI chat - it would send the spec to Scalar's servers - and no developer toolbar
scalar.agent.disabled=true
scalar.show-developer-tools=never
# No separate API client: each operation's Test Request button is enough
scalar.hide-client-button=true
# Fonts from the app itself (static/fonts), not from Scalar's font server; no "Powered by Scalar" link
scalar.with-default-fonts=false
scalar.custom-css=\
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url(/fonts/InterVariable.woff2) format("woff2"); } \
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(/fonts/JetBrainsMono-Regular.woff2) format("woff2"); } \
  a[href="https://www.scalar.com"] { display: none; }
