# Hibernate never alters the schema - Liquibase owns it. Just verify entities match the tables.
spring.jpa.hibernate.ddl-auto=validate

# Render Page results in the stable { content, page } shape (PagedModel) instead of raw PageImpl
spring.data.web.pageable.serialization-mode=via_dto

# Cap how many rows one page request can pull
spring.data.web.pageable.max-page-size=100
# (optional) change the default page size for unparameterized requests
spring.data.web.pageable.default-page-size=20

# Log every SQL statement Hibernate executes
logging.level.org.hibernate.SQL=DEBUG

# Close the session at the end of the service layer, not the end of the request
spring.jpa.open-in-view=false
